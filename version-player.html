<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azora Version Player</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #0b1020;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #azoraVersionFrame {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 56px;
            width: 100%;
            height: calc(100% - 56px);
            border: 0;
            background: #111;
        }
        #azoraGoBackBar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 56px;
            z-index: 2147483647;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 0 14px;
            background: linear-gradient(90deg, #7c3aed, #2563eb);
            box-shadow: 0 -6px 20px rgba(0,0,0,0.35);
        }
        #azoraGoBackBar strong { font-size: 14px; }
        #azoraGoBackBar button {
            border: 0;
            border-radius: 999px;
            padding: 8px 16px;
            font-weight: 800;
            cursor: pointer;
            background: #fff;
            color: #1e1b4b;
        }
    </style>
</head>
<body>
    <iframe id="azoraVersionFrame" title="Older Azora version"></iframe>
    <div id="azoraGoBackBar">
        <strong id="azoraGoBackLabel">Older version</strong>
        <button type="button" onclick="location.href='index.html'">Go back to current Azora</button>
    </div>
    <script>
        var params = new URLSearchParams(location.search);
        var id = String(params.get("v") || "").trim();
        id = id.replace(/\.\./g, "").replace(/[\\/]/g, "");
        var frame = document.getElementById("azoraVersionFrame");
        var label = document.getElementById("azoraGoBackLabel");
        if (!id || id === "current") {
            location.href = "index.html";
        } else {
            if (label) label.textContent = "Viewing Azora " + id;
            frame.src = "ExtraContent/Versions/" + id + "/index.html";
        }
    </script>
</body>
</html>
